name: Build installers

# Builds all three installers on GitHub's machines (each OS can only build its own app):
#   Windows -> SatLink-Setup-<version>.exe          (installer/build_installer.ps1)
#   macOS   -> SatLink-<version>-macOS-<arch>.dmg   (installer/build_macos.sh)
#   Linux   -> SatLink-<version>-linux-x86_64.AppImage (installer/build_linux.sh)
on:
  # Pushing a tag like v3.0.0 (or v3.0.0-beta.1) builds everything and publishes a GitHub Release.
  # A tag with a "-" suffix becomes a pre-release, e.g. for student testing before merging to main.
  push:
    tags: ["v*"]
  # Manual run from the Actions tab; the files appear under the run's "Artifacts".
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for the file names"
        default: "3.0.0"
        required: true

permissions:
  contents: write # needed to create the release and upload the files

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            V="${TAG#v}"   # v3.0.0-beta.1 -> 3.0.0-beta.1
            V="${V%%-*}"   # -> 3.0.0 (installers need a plain numeric version)
          else
            V="$INPUT_VERSION"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # Windows PowerShell 5.1 on purpose: it is what users have by default.
      - name: Build Sat-Link.exe and installer
        shell: powershell
        run: .\installer\build_installer.ps1 -PythonExe python -Version $env:VERSION

      - name: Smoke test (app must still be running after 30 s)
        shell: pwsh
        run: |
          $p = Start-Process "dist\Sat-Link\Sat-Link.exe" -PassThru
          Start-Sleep 30
          if ($p.HasExited) { Write-Error "App exited early (exit code $($p.ExitCode))"; exit 1 }
          Write-Host "App is running."
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SatLink-windows
          path: release/*.exe
          if-no-files-found: warn

  macos:
    needs: version
    name: macos (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: Apple Silicon
          - runner: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Sat-Link.app and .dmg
        run: bash installer/build_macos.sh "$VERSION" python

      - name: Smoke test (app must still be running after 30 s)
        run: |
          ./dist/Sat-Link.app/Contents/MacOS/Sat-Link > smoke.log 2>&1 &
          PID=$!
          sleep 30
          if kill -0 "$PID" 2>/dev/null; then
            echo "App is running."
            screencapture -x smoke.png || true
            kill "$PID"
          else
            echo "App exited early. Output:"
            cat smoke.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SatLink-macOS-${{ runner.arch }}
          path: release/*.dmg
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-macOS-${{ runner.arch }}
          path: |
            smoke.png
            smoke.log
          if-no-files-found: ignore

  linux:
    needs: version
    # Oldest supported Ubuntu, so the AppImage also runs on older distributions (glibc 2.35+).
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # These get bundled into the AppImage, so users do not need to install them.
      - name: Install Qt system libraries and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libdbus-1-3 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libgl1 libegl1 xvfb

      - name: Build Sat-Link AppImage
        run: bash installer/build_linux.sh "$VERSION" python

      - name: Smoke test (app must still be running after 30 s)
        run: |
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 30 xvfb-run -a -s "-screen 0 1600x1000x24" \
            ./release/SatLink-"$VERSION"-linux-x86_64.AppImage > smoke.log 2>&1
          rc=$?
          if [ "$rc" -eq 124 ]; then echo "App is running."; else echo "App exited early ($rc). Output:"; cat smoke.log; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SatLink-linux
          path: release/*.AppImage
          if-no-files-found: warn

  release:
    # Runs after the builds even if one of them failed, so the others still get published.
    needs: [version, windows, macos, linux]
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SatLink-*
          path: files
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          # A release shows whoever owns the token as its author. Publishing needs a RELEASE_TOKEN secret
          # (a personal access token); without it the release is not created as github-actions[bot],
          # and the files stay under the run's "Artifacts" to be published by hand (gh release create).
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::notice::No RELEASE_TOKEN secret: installers are in this run's Artifacts; release not published."
            exit 0
          fi
          shopt -s nullglob
          files=(files/*.exe files/*.dmg files/*.AppImage)
          ls -la "${files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then echo "No installers were built." >&2; exit 1; fi

          prerelease=""
          title="Sat-Link $VERSION"
          if [[ "$TAG" == *-* ]]; then
            prerelease="--prerelease"
            title="Sat-Link $VERSION (${TAG#*-} – testing)"
          fi

          cat > notes.md <<EOF
          ## Downloads

          | System | File |
          |---|---|
          | Windows 10/11 (64-bit) | \`SatLink-Setup-$VERSION.exe\` |
          | macOS – Apple Silicon (M1 and newer) | \`SatLink-$VERSION-macOS-arm64.dmg\` |
          | macOS – Intel | \`SatLink-$VERSION-macOS-x86_64.dmg\` |
          | Linux (64-bit) | \`SatLink-$VERSION-linux-x86_64.AppImage\` |

          **Windows:** run the installer. If SmartScreen appears, click *More info → Run anyway*.

          **macOS:** open the \`.dmg\` and drag Sat-Link into Applications. The first launch is blocked
          because the app is not signed with an Apple Developer ID: open *System Settings → Privacy & Security*
          and click *Open Anyway*.

          **Linux:** make the file executable and run it:

              chmod +x SatLink-$VERSION-linux-x86_64.AppImage
              ./SatLink-$VERSION-linux-x86_64.AppImage

          Found a problem? Please open an issue: https://github.com/$GITHUB_REPOSITORY/issues
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file notes.md --verify-tag $prerelease
          fi
